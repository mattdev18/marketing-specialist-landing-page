<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matthew Ponce — Klaviyo Email &amp; SMS Specialist for Shopify Brands</title>

    <!-- Primary SEO -->
    <meta name="description" content="Matthew Ponce helps Shopify brands grow revenue, retention, and repeat purchases with Klaviyo email & SMS marketing — and builds fast, conversion-focused Shopify and WordPress websites. Book a free strategy call." />
    <meta name="author" content="Matthew Ponce" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#071B14" />
    <!-- Canonical: replace [SITE_URL] with the production domain -->
    <link rel="canonical" href="https://[SITE_URL]/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matthew Ponce — Email & Web Growth" />
    <meta property="og:title" content="Matthew Ponce — Klaviyo Email & SMS Specialist for Shopify Brands" />
    <meta property="og:description" content="Email & SMS that turns one-time buyers into repeat revenue — plus fast, conversion-focused Shopify and WordPress builds. Book a free strategy call." />
    <meta property="og:url" content="https://[SITE_URL]/" />
    <meta property="og:image" content="https://[SITE_URL]/images/hero.jpg" />
    <meta property="og:image:alt" content="Glass email and analytics cards floating over a deep green background" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matthew Ponce — Klaviyo Email & SMS Specialist for Shopify Brands" />
    <meta name="twitter:description" content="Email & SMS that turns one-time buyers into repeat revenue — plus fast Shopify and WordPress builds." />
    <meta name="twitter:image" content="https://[SITE_URL]/images/hero.jpg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- LCP image preload (decorative hero visual) -->
    <link rel="preload" as="image" href="/images/hero.jpg" fetchpriority="high" />

    <!--
      NOTE ON STRUCTURED DATA:
      JSON-LD requires an inline <script>, which a strict Content-Security-Policy
      (script-src 'self') blocks. To keep the hardened CSP intact, structured data
      is expressed as schema.org MICRODATA directly in the markup (see App.tsx:
      Person + ProfessionalService). This is fully supported by Google.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
